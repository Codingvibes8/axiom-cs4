name: Publish Axiom Action

on:
  push:
    tags:
      - 'v*'          # triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true

jobs:
  validate-action:
    name: Validate Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate action.yml exists
        run: test -f action.yml

      - name: Validate scripts/axiom-sync.js exists
        run: test -f scripts/axiom-sync.js

      - name: Test axiom-sync.js syntax
        run: node --check scripts/axiom-sync.js

      - name: Self-test action (validate mode, no credentials)
        continue-on-error: true
        env:
          AXIOM_API_URL: 'https://example.com'
          AXIOM_PROJECT_ID: 'proj_test'
          AXIOM_TOKEN: 'test_token'
          ENV_FILE: '.env.local.example'
          ENVIRONMENT: 'production'
          MODE: 'validate'
          FAIL_ON_DRIFT: 'false'
        run: node scripts/axiom-sync.js

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [validate-action]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create major version tag (e.g. v1)
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Release $MAJOR pointing to $VERSION"
          git push origin "$MAJOR" --force

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Axiom Action ${tag}`,
              body: `## Axiom Secrets Sync — ${tag}\n\n### Usage\n\`\`\`yaml\n- uses: codingvibes8/axiom-action@${tag}\n  with:\n    axiom_api_url: \${{ secrets.AXIOM_API_URL }}\n    axiom_project_id: \${{ secrets.AXIOM_PROJECT_ID }}\n    axiom_token: \${{ secrets.AXIOM_AGENT_TOKEN }}\n    mode: validate\n\`\`\`\n\nSee [README-action.md](./README-action.md) for full documentation.`,
              draft: false,
              prerelease: tag.includes('-'),
            });
            console.log(`Created release: ${release.html_url}`);
